---
# cocoon.yaml — generated by `cocoon setup`
#
# Cocoon turns this manifest into an OCI builder image that, when run, executes
# the build hermetically and stages artifacts + attestations to a mounted
# volume. Run `cocoon build` from this directory to produce the image.

# ---------------------------------------------------------------------------
# source: where to clone the code from at build time.
# ---------------------------------------------------------------------------
source:
  repository: https://github.com/carabiner-labs/demo-cowsay
  # ref: main          # branch, tag, or 40-char commit. Omit for default branch HEAD.
  # codebase: golang:./
  # When the repo holds more than one codebase, this selects which one the
  # unpack library extracts dependencies from. Format: "<lang>:<rel-path>".
  # Omit when there's only one. Override at build time with --codebase.

# ---------------------------------------------------------------------------
image: # identity of the produced builder image.
   base: cgr.dev/chainguard/wolfi-base:latest
   reference: ghcr.io/carabiner-labs/builds/cowsay

# ---------------------------------------------------------------------------
# environment: tools, OS packages, and env vars baked into the builder image.
#   snapshot  — RFC3339 timestamp pinning the APK repo snapshot for
#               reproducibility (see Wolfi's snapshot index).
# ---------------------------------------------------------------------------
environment:
  snapshot: "2025-01-01T00:00:00Z"
  packages:
   # - name: bash
  variables:
    CGO_ENABLED: "0"

# ---------------------------------------------------------------------------
# languages: toolchain provisioned in the image.
# ---------------------------------------------------------------------------
languages:
  type: golang
  version: "1.26.3"

# ---------------------------------------------------------------------------
# build: one entry per job. Each job runs inside the builder image with cwd
# set to /workspace, where the cloned source lives. Write build products
# wherever you like; the runner pre-creates the parent directory of every
# declared output, so `./bin/foo` works without a separate `mkdir -p bin`.
# Each path listed under `outputs` is copied (with a manifest.json sidecar)
# into /cocoon/output/artifacts/<name>/ on the mounted volume.
# ---------------------------------------------------------------------------
build:
  - job: build-linux-amd64
    command: go build -trimpath -o ./bin/cowsay-linux-amd64 .
    outputs:
      - type: file
        path: ./bin/cowsay-linux-amd64

  - job: build-linux-amd64
    command: go build -trimpath -o ./bin/cowsay-darwin-arm64 .
    env:
      GOOS: darwin
      GOARCH: arm64
    outputs:
      - type: file
        path: ./bin/cowsay-darwin-arm64 

# ---------------------------------------------------------------------------
# policies: build-time verification steps. Each entry is evaluated by AMPEL
# against the named subject. `pre-build` runs before any image work; failures
# abort the build (or warn with `--enforce=false`). `post-build` / `publish`
# slots are reserved for future evaluation hooks.
# ---------------------------------------------------------------------------
# policies:
#   - step: pre-build
#     subject: git+https://github.com/<org>/<repo>
#     policySet: git+https://github.com/<org>/policies@<commit-sha>#path/to/set.json

# ---------------------------------------------------------------------------
# envPolicy: policy entries for the runtime environment-policy gate. The
# runner reads attestations from /cocoon/attestations/env/ and verifies them
# against each policy at container startup before running any build job.
# Each entry is either a bare URI (shorthand) or a {source, context} struct.
# The optional context map is registered with the verifier as an AMPEL
# context provider. `--env-policy` on the CLI replaces this list with
# URIs only (no context).
# ---------------------------------------------------------------------------
envPolicy:
   - git+https://github.com/carabiner-dev/examples#edera/edera-check-node.hjson
   - source: git+https://github.com/carabiner-dev/examples#edera/edera-hermetic-workload.hjson
     context:
        hermetic: false

# ---------------------------------------------------------------------------
# runnerPolicies: per-subject policy entries for runner gates. Each subject
# maps to a directory under /cocoon/attestations/runner/<subject>/ from
# which the runner reads evidence at startup. "source" is the canonical key
# for the source-commit subject. Same {source, context} shape as envPolicy.
# ---------------------------------------------------------------------------
# runnerPolicies:
#   source:
#     - git+https://github.com/<org>/policies@<commit-sha>#runner/source.json
#     - source: git+https://github.com/<org>/policies@<commit-sha>#runner/source-ctx.json
#       context:
#         min_severity: high

# ---------------------------------------------------------------------------
# gates: runtime gate behavior baked into the image.
#   delay         — wait before each gate's first verification attempt.
#   maxWait       — per-gate retry budget on missing attestations.
#   bakePolicies  — when true (default), compile and ship each policy locator
#                   as JSON inside the image; when false, the runner fetches
#                   them at startup.
#   envDetectors  — ordered list of environment detectors used to resolve the
#                   env-policy gate's subject (e.g. ["spire"]).
# Baked policies live at /cocoon/policies/env/ and /cocoon/policies/runner/<subject>/.
# ---------------------------------------------------------------------------
# gates:
#   delay: 15s
#   maxWait: 5m
#   bakePolicies: true
#   envDetectors:
#     - spire
